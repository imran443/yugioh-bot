name: Test

# Test layers: docs/adr/0003-duel-test-layers.md ("CI" section).
#
#   cores        build or restore the engine bundle (standard, domain and multi cores). Shared by the next jobs.
#   unit         typecheck and the tests that need no core (shared, bot, web, duel-server unit, e2e unit).
#   engine       real-engine tests with DUEL_REQUIRE_CORES=1: a missing core is a failure, never a silent skip.
#   engine-legacy  1v1 host/worker gates with DUEL_1V1_ENGINE=legacy, plus main's engine tests
#                run against the legacy engine (tests/legacy-main). The engine job runs the merged engine ("pinned").
#                Production Compose defaults Standard to DUEL_STANDARD_1V1_ENGINE=pinned; Domain keeps the global legacy default.
#   native       ASan/UBSan build of the multi core and the committed native checks (npm run test:native).
#   rule-coverage  every rule of ADR-0002 has a covering test (--strict).
#   nduel-nightly  scheduled: the nduel fuzz (n2, n3, n4, tag) with --check-future, and the golden hash check.
#
# Pull requests and pushes to main always run unit. They run cores, engine, engine-legacy, native and rule-coverage
# only when changes sets engine=true. A manual run runs every job, including nduel-nightly unless nightly=false.
# The schedule runs cores and nduel-nightly only.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Run the nightly nduel fuzz and golden check"
        type: boolean
        required: false
        default: true
      nduel_seeds:
        description: "Seeds per nduel case in the nightly fuzz"
        required: false
        default: "100"

concurrency:
  # The event name is in the group: a long nightly run must not hold back (or cancel) the push runs on main.
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The engine bundle for CI. Not data/duel-engine (that is the deploy bundle, with no multi cores).
  # data/duel-engine-next is also the folder the native nduel tools read by default.
  BUNDLE_DIR: data/duel-engine-next

jobs:
  # Which layers a change can affect (scripts/ci/changed-layers.mjs). Pull requests diff from the merge base; pushes
  # to main diff from the previous tip (github.event.before). Manual runs, the schedule and a push without a usable
  # diff set engine=true and golden=true.
  #   engine      the duel engine, its shared dependencies, e2e, the engine bundle inputs, the lockfile, the ADR-0002
  #               rules or this workflow changed: cores, engine, engine-legacy, native and rule-coverage run.
  #   golden      core patches/pins, overlays, native tooling or data pins changed: check golden in the native job.
  # Changes outside these paths (for example web-only UI changes) run only the unit jobs.
  changes:
    name: Changed layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      golden: ${{ steps.diff.outputs.golden }}
      tests_only: ${{ steps.diff.outputs.tests_only }}
      base: ${{ steps.diff.outputs.base }}
      head: ${{ steps.diff.outputs.head }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node scripts/ci/changed-layers.mjs

  core-cache:
    name: Engine core cache
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.bundle.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # v5 keeps the parallel build inputs and invalidates bundles from before PR #124.
      # Raise the literal version when workflow build flags or bundle metadata change.
      # The emsdk image comes from pins.json; the independent builders read the same pin.
      - name: Compute bundle cache key
        id: key
        run: echo "key=duel-engine-ci-v5-${{ hashFiles('scripts/ci/build-core.sh', 'scripts/ci/parallel-emxx.py', 'scripts/ci/bin/em++', 'scripts/ci/core-cache-key.mjs', 'scripts/ci/assemble-core-bundle.mjs', 'packages/duel-server/scripts/prepare-data.ts', 'packages/duel-server/scripts/card-script-patches.ts', 'packages/duel-server/card-script-patches/**', 'packages/duel-server/scripts/released-card-data.ts', 'packages/duel-server/scripts/prerelease-history.ts', 'packages/duel-server/scripts/prerelease-graduations.ts', 'packages/duel-server/scripts/prerelease-script-smoke.ts', 'packages/duel-server/scripts/prerelease-script-exclusions.ts', 'packages/duel-server/card-remap-overrides.json', 'packages/duel-server/scripts/build-domain-core.ts', 'packages/duel-server/scripts/build-domain-core.sh', 'packages/duel-server/scripts/build-standard-core.sh', 'packages/duel-server/scripts/build-multi-core.sh', 'packages/duel-server/scripts/prepare-multi-core-tree.sh', 'packages/duel-server/scripts/multi-core-common.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/expected-sha256.txt', 'packages/duel-server/domain-core/patches/*.patch', 'packages/duel-server/domain-core/src/**', 'packages/duel-server/domain-core/lua/**', 'packages/duel-server/legacy-1v1/**', 'packages/duel-server/domain-core/multi-scripts/**', 'packages/duel-server/src/multi-scripts.ts', 'packages/duel-server/src/released-database-files.ts', 'packages/duel-server/src/cards.ts', 'packages/shared/src/duels/**', 'packages/shared/package.json', 'packages/shared/tsconfig*.json', 'tsconfig.json', 'patches/ocgcore-wasm+0.1.2.patch', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Read the emsdk image from pins.json
        run: node -p "const e = require('./packages/duel-server/domain-core/pins.json').emscripten; 'EMSDK_IMAGE=' + e.image + '@' + e.digest" >> "$GITHUB_ENV"
      - name: Look up engine bundle
        id: bundle
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ steps.key.outputs.key }}

  core-build:
    name: Build core (${{ matrix.target }})
    if: needs.core-cache.outputs.hit != 'true'
    needs: core-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [standard, domain, legacy-domain, multi, multi-domain, multi-ref, multi-ref-domain, multi-trap, multi-domain-trap]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute core cache key
        id: key
        run: node scripts/ci/core-cache-key.mjs ${{ matrix.target }}
      - name: Restore compiled core
        id: core
        uses: actions/cache/restore@v4
        with:
          path: ci-core/${{ matrix.target }}
          key: ${{ steps.key.outputs.key }}
      - name: Setup Node.js
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore compiler libraries
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/emscripten
          key: emcache-v1-${{ matrix.target }}-${{ hashFiles('packages/duel-server/domain-core/pins.json', 'packages/duel-server/legacy-1v1/domain-core/pins.json') }}-${{ steps.key.outputs.key }}
          # Emscripten validates its system-library flags. A previous patch series can reuse those libraries.
          restore-keys: |
            emcache-v1-${{ matrix.target }}-${{ hashFiles('packages/duel-server/domain-core/pins.json', 'packages/duel-server/legacy-1v1/domain-core/pins.json') }}-
      - name: Install
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts
          npx patch-package --error-on-fail
      - name: Build core with all runner CPUs
        if: steps.core.outputs.cache-hit != 'true'
        run: prlimit --core=1:1 -- bash scripts/ci/build-core.sh ${{ matrix.target }}
      - name: Verify compiled core hashes
        run: prlimit --core=1:1 -- bash scripts/ci/build-core.sh ${{ matrix.target }} --verify-only
      - name: Save compiled core
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ci-core/${{ matrix.target }}
          key: ${{ steps.key.outputs.key }}
      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: ci-core/
          if-no-files-found: error
          retention-days: 1

  cores:
    name: Engine cores (build or restore)
    if: always() && needs.core-cache.result == 'success'
    needs: [core-cache, core-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ needs.core-cache.outputs.key }}
    steps:
      - name: Check core build results
        env:
          CORE_BUILD: ${{ needs.core-build.result }}
        run: |
          case "$CORE_BUILD" in
            success|skipped) ;;
            *) echo "Core build result: $CORE_BUILD" >&2; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore engine bundle
        if: needs.core-cache.outputs.hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.core-cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Setup Node.js
        if: needs.core-cache.outputs.hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: needs.core-cache.outputs.hit != 'true'
        run: npm ci
      # The prerelease smoke check uses the shared artwork resolver through src/cards.ts.
      - name: Build shared for card preparation
        if: needs.core-cache.outputs.hit != 'true'
        run: npm run build --workspace=packages/shared
      - name: Prepare card data and scripts
        if: needs.core-cache.outputs.hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
        run: npm run duel:prepare
      - name: Download all cores
        if: needs.core-cache.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: ci-core
          merge-multiple: true
      # Build jobs have separate manifests. Only this step writes the final manifest, in serial build order.
      - name: Assemble engine bundle
        if: needs.core-cache.outputs.hit != 'true'
        env:
          DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
        run: node scripts/ci/assemble-core-bundle.mjs

      - name: Install multi cores into the bundle
        if: needs.core-cache.outputs.hit != 'true'
        run: |
          set -eu
          dist=packages/duel-server/domain-core/dist
          cp "$dist/ocgcore.multi.sync.wasm" "$BUNDLE_DIR/ocgcore.multi.wasm"
          cp "$dist/ocgcore.multi-domain.sync.wasm" "$BUNDLE_DIR/ocgcore.multi-domain.wasm"
          for stem in ocgcore.multi ocgcore.multi-domain; do
            printf 'tag=ci-%s\nsource=%s\nsha256=%s\ncapabilities=ffa4-facing-extra-zones\ninstalled=%s\nnote=built by .github/workflows/test.yml\n' \
              "${GITHUB_SHA::12}" "$dist/$stem.sync.wasm" \
              "$(sha256sum "$dist/$stem.sync.wasm" | cut -d' ' -f1)" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$BUNDLE_DIR/$stem.SOURCE"
          done

      - name: Verify engine bundle
        run: |
          set -eu
          for f in ocgcore.standard.wasm ocgcore.domain.wasm ocgcore.multi.wasm ocgcore.multi-domain.wasm ocgcore.multi.SOURCE ocgcore.multi-domain.SOURCE cards.cdb; do
            test -s "$BUNDLE_DIR/$f" || { echo "bundle file missing or empty: $BUNDLE_DIR/$f" >&2; exit 1; }
          done
          for f in ocgcore.multi.sync.wasm ocgcore.multi-ref.sync.wasm ocgcore.multi-domain.sync.wasm ocgcore.multi-ref-domain.sync.wasm ocgcore.multi-trap.sync.wasm ocgcore.multi-domain-trap.sync.wasm; do
            test -s "packages/duel-server/domain-core/dist/$f" || { echo "differential core missing or empty: $f" >&2; exit 1; }
          done
          DUEL_DATA_DIR="$PWD/$BUNDLE_DIR" sh packages/duel-server/scripts/install-engine-bundle.sh
          # The legacy 1v1 files must match the approved legacy pin (sha256 pinned in legacy-1v1/expected-sha256.txt), also when the bundle came from the cache.
          sh packages/duel-server/scripts/check-legacy-pin.sh "$PWD/$BUNDLE_DIR"

      - name: Verify pinned core hashes
        run: |
          set -eu
          dist=packages/duel-server/domain-core/dist
          (cd "$dist" && sha256sum --check ../expected-sha256.txt)
          for target in domain multi multi-domain; do
            cmp "$dist/ocgcore.$target.sync.wasm" "$BUNDLE_DIR/ocgcore.$target.wasm"
          done

      - name: Save engine bundle
        if: needs.core-cache.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.core-cache.outputs.key }}

  unit-packages:
    name: Unit packages and typecheck
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.changes.outputs.tests_only == 'true' && '0' || '1' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@yugidraft/shared

      - name: Build worker
        run: npm run build --workspace=packages/worker

      - name: Test worker
        run: npm test --workspace=packages/worker

      - name: Build web with a dummy Clerk public key
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: npm run build --workspace=packages/web

      - name: Deployment script tests
        run: npx vitest run scripts/staging/deploy.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test shared
        run: npm test --workspace=packages/shared

      - name: Test bot
        run: npm test --workspace=packages/bot

      - name: Test CI helpers
        run: |
          node --test scripts/ci/*.test.mjs
          python3 -B scripts/ci/parallel_emxx_test.py

      - name: Select changed test files
        id: selection
        if: needs.changes.outputs.tests_only == 'true'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/select-engine-tests.mjs

      # Needs the test:unit script of duel-server: the tests that load no wasm core.
      - name: Test duel-server (no core)
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.files }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const selected = process.env.CI_TEST_FILES ? JSON.parse(process.env.CI_TEST_FILES) : undefined;
          const narrow = selected?.length > 0;
          const files = narrow ? selected : ['tests'];
          if (selected?.length === 0) console.warn('Empty CI test selection; falling back to the full suite.');
          const result = spawnSync('npm', ['exec', '--workspace=packages/duel-server', '--', 'vitest', 'run', ...files,
            '--config=vitest.unit.config.ts', '--testTimeout=15000', ...(narrow ? ['--passWithNoTests'] : [])], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS

      - name: Test e2e helpers
        run: npm run test:unit --workspace=@yugidraft/e2e

  unit-web:
    name: Web unit tests (${{ matrix.shard }}/4)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build shared
        run: npm run build --workspace=@yugidraft/shared
      - name: Test web
        run: npm test --workspace=packages/web -- --shard=${{ matrix.shard }}/4

  # Keep the branch-protection check names. A failed or cancelled shard fails the aggregate.
  unit:
    name: Unit tests (no core)
    if: always() && github.event_name != 'schedule'
    needs: [unit-packages, unit-web]
    runs-on: ubuntu-latest
    steps:
      - name: Check all unit jobs
        env:
          PACKAGES: ${{ needs.unit-packages.result }}
          WEB: ${{ needs.unit-web.result }}
        run: test "$PACKAGES" = success && test "$WEB" = success

  engine-shards:
    name: Engine tests shard (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.count }})
    if: ${{ !cancelled() && needs.cores.result == 'success' && github.event_name != 'schedule' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [pinned]
        shard: [1, 2, 3, 4, 5, 6]
        count: [6]
        # Keep the slow host/differential files off the regular+Table shards.
        # Both surrender modes and all differential seeds still run across these groups.
        include:
          - { suite: surrender, shard: 1, count: 2 }
          - { suite: surrender, shard: 2, count: 2 }
          - { suite: differential, shard: 1, count: 2 }
          - { suite: differential, shard: 2, count: 2 }
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      # The cores of the cores job have the canonical names. Without these paths cores.ts would look for the
      # local tagged builds first. NSEAT_LIVE opens the live N-seat scenarios (a missing flag fails in require mode).
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
      # The Table test (tests/multi-scripts-table.test.ts) needs the debug core of the cores job; in require mode a missing file fails.
      TABLE_TRAP_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-trap.sync.wasm
      TABLE_TRAP_DOMAIN_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain-trap.sync.wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.changes.outputs.tests_only == 'true' && '0' || '1' }}

      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@yugidraft/shared

      - name: Select changed test files
        id: selection
        if: needs.changes.outputs.tests_only == 'true'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/select-engine-tests.mjs

      - name: Engine tests
        if: needs.changes.outputs.engine == 'true'
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.count }}

      # Web tests that run a real stock-core duel. The unit job has no engine bundle, so they skip there.
      # DUEL_REQUIRE_CORES=1 (from the job env) makes a missing bundle a failure here.
      # The step finds the files itself: every web test that imports the shared cores helper
      # (describeWithCores / itWithCores) runs here, so a new engine test needs no edit of this file.
      # Only direct imports of the cores helper are found. A web test that gets the helper through another module is not run here.
      # The full web suite (about 400 files) already runs in the unit job, so only the matching files run again.
      - name: Web tests with the engine
        if: matrix.suite == 'pinned' && matrix.shard == 1 && needs.changes.outputs.tests_only != 'true'
        run: |
          set -o pipefail
          # Lines that start with // or * are comments: a comment that names the helper does not count.
          files=$({ grep -rE "duel-server/tests/support/cores(\.js)?[\"']" packages/web/tests --include='*.test.ts' --include='*.test.tsx' || true; } | { grep -vE '^[^:]*:[[:space:]]*(//|\*)' || true; } | cut -d: -f1 | sed 's#^packages/web/##' | sort -u)
          if [ -z "$files" ]; then echo "No web test imports the cores helper. Fix this step."; exit 1; fi
          echo "$files"
          mapfile -t test_files <<< "$files"
          prlimit --core=1:1 -- npm exec --workspace=packages/web -- vitest run "${test_files[@]}"

      - name: Web engine tests that depend on changed duel helpers
        if: matrix.suite == 'pinned' && matrix.shard == 1 && needs.changes.outputs.tests_only == 'true'
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.web_files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs web 1/1

      # tests/*.smoke.ts are plain assert scripts (vitest does not match them); one failing script fails the step.
      - name: Engine smoke scripts
        if: needs.changes.outputs.engine == 'true' && matrix.suite == 'pinned' && matrix.shard == 1
        run: prlimit --core=1:1 -- npm run test:smoke --workspace=packages/duel-server

  engine-legacy-shards:
    name: Legacy 1v1 tests shard (${{ matrix.shard }}/2)
    if: ${{ !cancelled() && needs.cores.result == 'success' && github.event_name != 'schedule' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
      TABLE_TRAP_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-trap.sync.wasm
      TABLE_TRAP_DOMAIN_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain-trap.sync.wasm
      # Production starts 1v1 duels on the legacy engine. Run only its tests and host/worker gates. The setup file
      # (tests/support/setup.ts) keeps a value that is already set. tests/legacy-main is main's engine tests, unchanged
      # except for the import paths, and they always use the legacy engine.
      DUEL_1V1_ENGINE: legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.changes.outputs.tests_only == 'true' && '0' || '1' }}

      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@yugidraft/shared

      - name: Select changed test files
        id: selection
        if: needs.changes.outputs.tests_only == 'true'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/select-engine-tests.mjs

      - name: Engine tests, legacy 1v1 engine
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs legacy ${{ matrix.shard }}/2

  engine:
    name: Engine tests (cores required)
    if: always() && github.event_name != 'schedule'
    needs: [changes, engine-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Check all engine shards
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.engine }}
          RESULT: ${{ needs.engine-shards.result }}
        run: test "$CHANGES" = success && { test "$REQUIRED" != true || test "$RESULT" = success; }

  engine-legacy:
    name: Engine tests, legacy 1v1 engine (cores required)
    if: always() && github.event_name != 'schedule'
    needs: [changes, engine-legacy-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Check all legacy shards
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.engine }}
          RESULT: ${{ needs.engine-legacy-shards.result }}
        run: test "$CHANGES" = success && { test "$REQUIRED" != true || test "$RESULT" = success; }

  native:
    name: Native checks (ASan and UBSan)
    if: ${{ !cancelled() && needs.cores.result == 'success' && github.event_name != 'schedule' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The native tools read cards.cdb and the card scripts from data/duel-engine-next.
      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # scripts/native/checks/run.sh: builds the core from the repo patch series with ASan and UBSan and runs the
      # committed checks that are marked ready in checks.tsv. The fuzz matrix stays in nduel-nightly.
      - name: Native tests
        run: npm run test:native

      # The job runs for all engine changes; only core/overlay/data/native inputs (or a manual run) check golden.
      # Reuse test:native's repo-series library, pinned Lua and trap/ASan/UBSan flags; only compile the driver.
      - name: nduel golden hashes (--check)
        if: needs.changes.outputs.golden == 'true'
        env:
          NDUEL_DIR: ${{ github.workspace }}/packages/duel-server/domain-core/.build/nduel
          NDUEL_SKIP_BUILD: "1"
        run: |
          native="$GITHUB_WORKSPACE/packages/duel-server/domain-core/.build/native-checks"
          mkdir -p "$NDUEL_DIR"
          prlimit --core=1:1 -- g++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -O1 -g1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -fno-rtti \
            -DYGO_N_TRAP -D_GLIBCXX_ASSERTIONS -I"$native/lua-src" -I"$native/multi-core-tree" \
            packages/duel-server/scripts/native/nduel.cpp "$native/libocgcore-multi.a" -o "$NDUEL_DIR/nduel"
          prlimit --core=1:1 -- bash packages/duel-server/scripts/run-nduel.sh --check

      - name: Upload native status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-status
          path: .status/
          if-no-files-found: ignore

  rule-coverage:
    name: Rule coverage (strict)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # The script imports @yugidraft/shared/dist/duels, which only exists after the build.
      - name: Build shared
        run: npm run build --workspace=@yugidraft/shared

      # --check prints the table and writes no file. --strict fails when a rule of ADR-0002 has no covering test.
      - name: Rule coverage
        run: npx tsx packages/duel-server/scripts/rule-coverage.ts --check --strict

  nduel-nightly:
    name: nduel fuzz (${{ matrix.case }})
    if: ${{ !cancelled() && needs.cores.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) }}
    needs: cores
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        case: [n2, n3, n4, tag]
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      # Seeds 1..N for the case of this leg. --check-future turns the "future" checks (turn order, first attack,
      # elimination, one win, Tag LP) into failures.
      NDUEL_SEEDS: ${{ inputs.nduel_seeds || '100' }}
      NDUEL_CASES: ${{ matrix.case }}
      NDUEL_FUTURE: "1"
      NDUEL_DIR: ${{ github.workspace }}/nduel-work/${{ matrix.case }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # run-nduel.sh builds the core with -DYGO_N_TRAP and ASan/UBSan, then runs seeds 1..NDUEL_SEEDS of the case.
      - name: nduel fuzz with --check-future
        run: bash packages/duel-server/scripts/run-nduel.sh

      # Golden hashes: one leg is enough. Reuses the build of the step before. golden.tsv was recorded without
      # --check-future, so it is off here. It runs also when the fuzz step failed (run-nduel.sh fails loudly if the
      # binary is missing).
      - name: nduel golden hashes (--check)
        if: matrix.case == 'n2' && !cancelled()
        env:
          NDUEL_SKIP_BUILD: "1"
          NDUEL_FUTURE: "0"
        run: bash packages/duel-server/scripts/run-nduel.sh --check

      - name: Upload nduel status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nduel-status-${{ matrix.case }}
          path: |
            .status/nduel-summary.json
            .status/nduel-check.json
            nduel-work/${{ matrix.case }}/runs/*.err
          if-no-files-found: ignore

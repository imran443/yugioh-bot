services:
  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    user: "${UID}:${GID}"
    env_file:
      - .env
    command: sh -c "node packages/bot/dist/deploy-commands.js && node packages/bot/dist/index.js"
    volumes:
      - ./data:/app/data

  ws:
    build:
      context: .
      target: ws
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      - WEB_URL=http://web:3000
      - WS_PORT=3001
    command: node packages/ws/dist/server.js
    volumes:
      - ./data:/app/data
    depends_on:
      - bot

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    user: "${UID}:${GID}"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
    volumes:
      - ./data:/app/data
    depends_on:
      - ws

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # To enable HTTPS: add "443:443", replace :80 with your domain in Caddyfile,
      # and ensure caddy_data volume persists (stores Let's Encrypt certs).
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - ws

volumes:
  caddy_data:
  caddy_config:
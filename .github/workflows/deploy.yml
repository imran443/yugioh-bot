name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_PORT: ${{ secrets.VM_PORT || '22' }}

    steps:
      - name: Skip deploy when VM secrets are not configured
        if: ${{ env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_PRIVATE_KEY == '' }}
        run: echo "VM deploy secrets are not configured yet; skipping deploy."

      - name: Configure SSH key
        if: ${{ env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key

      - name: Trust VM host key
        if: ${{ env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' }}
        run: |
          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: ${{ env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_PRIVATE_KEY != '' }}
        run: |
          ssh -i ~/.ssh/vm_deploy_key \
            -p "$VM_PORT" \
            "$VM_USER@$VM_HOST" \
            'cd /opt/yugioh-bot && git fetch --all --prune && git reset --hard origin/main && docker compose build && docker compose down --remove-orphans && docker compose up -d && docker compose ps && docker compose logs --tail=40'
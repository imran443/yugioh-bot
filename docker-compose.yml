x-user: &user "${UID:-0}:${GID:-0}"  # Host UID/GID in dev; root by default.

services:
  ws:
    build:
      context: .
      target: ws
    restart: unless-stopped
    user: *user
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - OWNER_USER_IDS=${OWNER_USER_IDS:-}
      - WEB_URL=${WEB_URL:?WEB_URL is required}
      - WS_PORT=3001
      - WS_INTERNAL_PORT=4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
    command: node packages/ws/dist/server.js
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/socket.io/?EIO=4&transport=polling').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  duel:
    build:
      context: .
      target: duel-bundled
      additional_contexts:
        engine: ./.deploy-duel-engine
    restart: unless-stopped
    user: *user
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - OWNER_USER_IDS=${OWNER_USER_IDS:-}
      - DUEL_DATA_DIR=/app/data/duel-engine
      # The deploy installs on the host. Restarts verify the existing volume without replacing it.
      - DUEL_BUNDLE_SRC=${DUEL_BUNDLE_SRC_ON_START:-}
      - DUEL_INTERNAL_HOST=0.0.0.0
      - DUEL_INTERNAL_PORT=4003
      - DUEL_INTERNAL_SECRET=${DUEL_INTERNAL_SECRET}
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
      - DUEL_ARCHIVE_AFTER_MS=${DUEL_ARCHIVE_AFTER_MS:-600000}
      - DUEL_IDLE_WORKER_MS=${DUEL_IDLE_WORKER_MS:-300000}
      # Tag, 3-player and 4-player tables. Off by default: only 1v1 tables start. The web service needs the same value.
      - MULTIPLAYER_TABLES=${MULTIPLAYER_TABLES:-1}
      # The global 1v1 choice; Domain uses legacy by default. Standard has its own choice below.
      # pinned is the merged engine. A duel keeps the engine it started on. Tables with 3 or 4 seats always use the multi core.
      - DUEL_1V1_ENGINE=${DUEL_1V1_ENGINE:-legacy}
      # Standard defaults to pinned, including an empty value. Set legacy to roll back.
      - DUEL_STANDARD_1V1_ENGINE=${DUEL_STANDARD_1V1_ENGINE:-pinned}
      # Card script runtime failures report and continue; strict is an operational override.
      - DUEL_SCRIPT_ERRORS=${DUEL_SCRIPT_ERRORS:-tolerant}
      - DUEL_SCRIPT_ERROR_BLOCK_DUELS=${DUEL_SCRIPT_ERROR_BLOCK_DUELS:-3}
      - DUEL_SCRIPT_ERROR_BLOCK_WINDOW_DAYS=${DUEL_SCRIPT_ERROR_BLOCK_WINDOW_DAYS:-7}
    # The VM has 4 GB. The first game loads the card database and scripts (about 114 MB), each game adds a few MB.
    mem_limit: ${DUEL_MEM_LIMIT:-1g}
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}
    restart: unless-stopped
    user: *user
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - CARD_IMAGE_CACHE_DIR=/app/data/card-images
      - DISCORD_BOT_ENABLED=0
      - WEB_URL=${WEB_URL:?WEB_URL is required}
      - MARKETING_URL=${MARKETING_URL:-}
      - OWNER_USER_IDS=${OWNER_USER_IDS:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_DEFAULT_CHANNEL_ID=${DISCORD_DEFAULT_CHANNEL_ID:-}
      - DISCORD_REMINDER_CHANNEL_ID=${DISCORD_REMINDER_CHANNEL_ID:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required at runtime}
      # Direct Discord proof recovers pre-cutover players while Clerk is in Waitlist mode.
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
      - DUEL_SCENARIOS=${DUEL_SCENARIOS:-0}
      - DUEL_FX_LAB=${DUEL_FX_LAB:-0}
      - DRAFT_TEST_BOTS=${DRAFT_TEST_BOTS:-0}
      - THEME_DRAFTS=${THEME_DRAFTS:-0}
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
      - DUEL_INTERNAL_URL=http://duel:4003
      - DUEL_INTERNAL_SECRET=${DUEL_INTERNAL_SECRET}
      # Same flag as on the duel service. The web reads it on the server at run time, so a restart switches it.
      - MULTIPLAYER_TABLES=${MULTIPLAYER_TABLES:-1}
      # In-app Report bug button: the web server opens a GitHub issue per report. Without a token the report is only saved.
      - BUG_REPORT_GITHUB_TOKEN=${BUG_REPORT_GITHUB_TOKEN:-}
      - BUG_REPORT_GITHUB_REPO=${BUG_REPORT_GITHUB_REPO:-DuelingDomain/yugioh-bot}
    volumes:
      - ./data:/app/data
    depends_on:
      - ws
      - duel

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    user: *user
    stop_grace_period: 150s
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - OWNER_USER_IDS=${OWNER_USER_IDS:-}
      - CARD_IMAGE_CACHE_DIR=/app/data/card-images
      - CARD_IMAGE_CACHE_MAX_BYTES=${CARD_IMAGE_CACHE_MAX_BYTES:-16106127360}
      - WORKER_HEALTH_PATH=/tmp/yugidraft-worker-health.json
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_BOT_ENABLED=0
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
      - SETS_SYNC_CRON=${SETS_SYNC_CRON:-0 6 * * *}
      - SETS_SYNC_TIMEZONE=${SETS_SYNC_TIMEZONE:-UTC}
      - IMAGE_CLEANUP_CRON=${IMAGE_CLEANUP_CRON:-0 4 * * *}
      - IMAGE_CLEANUP_TIMEZONE=${IMAGE_CLEANUP_TIMEZONE:-UTC}
    volumes:
      - ./data:/app/data
    depends_on:
      - ws

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?Set SITE_DOMAIN in .env (localhost for local dev)}
      - MARKETING_DOMAIN=${MARKETING_DOMAIN:-marketing-disabled.localhost}
      - LEGACY_DOMAIN=${LEGACY_DOMAIN:-legacy-disabled.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site/public:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - ws

volumes:
  caddy_data:
  caddy_config:

# docker-compose.override.yml — local development only
#
# Docker Compose automatically merges this file with docker-compose.yml when
# you run `docker compose up` without specifying -f flags.
#
# Changes here:
#  - Switches the web service to the web-dev Dockerfile target (runs `next dev`)
#  - Bind-mounts source directories so Next.js HMR picks up file changes
#  - Enables watchpack polling (required on macOS — inotify doesn't cross the
#    Docker VM boundary for bind mounts)
#  - Keeps an anonymous volume for .next so the container's build cache is
#    never clobbered by what's (or isn't) on the host

services:
  web:
    build:
      target: web-dev
    environment:
      # File-watcher polling — required on macOS Docker Desktop
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Source — Next.js HMR watches these directories
      - ./packages/web/app:/app/packages/web/app
      - ./packages/web/src:/app/packages/web/src
      # Config files — mounted read-only; rebuild container if these change
      - ./packages/web/next.config.ts:/app/packages/web/next.config.ts:ro
      - ./packages/web/postcss.config.mjs:/app/packages/web/postcss.config.mjs:ro
      - ./packages/web/tsconfig.json:/app/packages/web/tsconfig.json:ro
      # Shared package — bind-mount source and built dist so shared changes are
      # visible. After editing shared code, run: docker compose exec web npm run build --workspace=@yugidraft/shared
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      # Anonymous volume: keeps Next.js .next cache inside the container
      - /app/packages/web/.next

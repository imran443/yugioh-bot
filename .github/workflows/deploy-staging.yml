name: Deploy Staging

# A separate staging stack on the production VM, for human tests of 3 and 4 player duels.
# Manual only. It never runs docker compose on docker-compose.yml and never writes in /opt/yugioh-bot.
# Runbook and owner steps: docs/deployment/staging.md

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch to run in staging"
        required: true
        default: main
        type: string
      refresh_db:
        description: "Copy the production database again (staging games and sign-ins are lost)"
        required: false
        default: false
        type: boolean
      action:
        description: "deploy builds and starts staging, stop takes it down"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - stop

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging stack on the VM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_PORT: ${{ secrets.VM_PORT || '22' }}
      # Inputs go through the environment, never straight into a shell line.
      INPUT_REF: ${{ inputs.ref }}
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_REFRESH_DB: ${{ inputs.refresh_db }}
      DEPLOY_COMMIT: ""
      # Optional repository variables. They are read only when .env.staging does not exist on the VM yet.
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_HOST: ${{ vars.STAGING_HOST || secrets.VM_HOST }}
      STAGING_HTTP_PORT: ${{ vars.STAGING_HTTP_PORT }}
      # Path only; staging Clerk secrets never travel through Actions or SSH.
      STAGING_CLERK_ENV: ${{ vars.STAGING_CLERK_ENV || '/etc/yugidraft/staging-clerk.env' }}

    steps:
      - name: Check inputs and secrets
        run: |
          set -eu
          printf '%s' "$STAGING_CLERK_ENV" | grep -Eq '^/[A-Za-z0-9_./-]+$' || { echo "Invalid STAGING_CLERK_ENV path" >&2; exit 1; }
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_PRIVATE_KEY" ]; then
            echo "The VM secrets (VM_HOST, VM_USER, VM_SSH_PRIVATE_KEY) are not set." >&2
            exit 1
          fi
          check() {
            printf '%s' "$2" | grep -Eq "$3" || { echo "$1 has a value that is not allowed." >&2; exit 1; }
          }
          check "ref" "$INPUT_REF" '^[A-Za-z0-9._/-]+$'
          check "action" "$INPUT_ACTION" '^(deploy|stop)$'
          check "refresh_db" "$INPUT_REFRESH_DB" '^(true|false)$'
          check "STAGING_HOST" "$STAGING_HOST" '^[A-Za-z0-9.-]+$'
          if [ -n "$STAGING_DOMAIN" ]; then check "STAGING_DOMAIN" "$STAGING_DOMAIN" '^[A-Za-z0-9.-]+$'; fi
          # A host port below 1024 is refused: 80 and 443 belong to the production Caddy.
          if [ -n "$STAGING_HTTP_PORT" ]; then check "STAGING_HTTP_PORT" "$STAGING_HTTP_PORT" '^[1-9][0-9]{3,4}$'; fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record checked-out deploy commit
        if: ${{ inputs.action == 'deploy' }}
        run: echo "DEPLOY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Same inputs as the key in deploy.yml: the standard and domain bundle is the same as production.
      # BUNDLE_CACHE_KEY is the production key. This workflow only READS it. It saves under the
      # staging-prefixed key, so a staging run can never put a bundle where the production deploy reads it.
      - name: Compute bundle cache key
        if: ${{ inputs.action == 'deploy' }}
        run: echo "BUNDLE_CACHE_KEY=duel-engine-${{ hashFiles('packages/duel-server/scripts/prepare-data.ts', 'packages/duel-server/scripts/card-script-patches.ts', 'packages/duel-server/card-script-patches/**', 'packages/duel-server/scripts/released-card-data.ts', 'packages/duel-server/scripts/prerelease-history.ts', 'packages/duel-server/scripts/prerelease-graduations.ts', 'packages/duel-server/scripts/prerelease-script-smoke.ts', 'packages/duel-server/scripts/prerelease-script-exclusions.ts', 'packages/duel-server/card-remap-overrides.json', 'packages/duel-server/scripts/build-domain-core.ts', 'packages/duel-server/scripts/build-domain-core.sh', 'packages/duel-server/scripts/build-standard-core.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/src/**', 'packages/duel-server/domain-core/lua/**', 'packages/duel-server/legacy-1v1/**', 'packages/duel-server/domain-core/multi-scripts/**', 'packages/duel-server/src/multi-scripts.ts', 'packages/duel-server/src/released-database-files.ts', 'packages/duel-server/src/cards.ts', 'packages/shared/src/duels/**', 'packages/shared/package.json', 'packages/shared/tsconfig*.json', 'tsconfig.json', 'patches/ocgcore-wasm+0.1.2.patch', 'package-lock.json') }}" >> "$GITHUB_ENV"

      - name: Compute staging bundle cache key
        if: ${{ inputs.action == 'deploy' }}
        run: echo "STAGING_BUNDLE_CACHE_KEY=staging-$BUNDLE_CACHE_KEY" >> "$GITHUB_ENV"

      # Both multi cores share a key: all build scripts, numbered patches and Domain source inputs.
      # The version prefix is a literal: raise it when the build step below changes (the hash cannot see it).
      - name: Compute multi core cache key
        if: ${{ inputs.action == 'deploy' }}
        run: echo "MULTI_CACHE_KEY=duel-multi-cores-staging-v3-${{ hashFiles('packages/duel-server/scripts/build-deploy-multi-cores.sh', 'packages/duel-server/scripts/package-deploy-multi-cores.mjs', 'packages/duel-server/scripts/build-multi-core.sh', 'packages/duel-server/scripts/prepare-multi-core-tree.sh', 'packages/duel-server/scripts/multi-core-common.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/patches/*.patch', 'packages/duel-server/domain-core/src/**') }}" >> "$GITHUB_ENV"

      - name: Read the emsdk image from pins.json
        if: ${{ inputs.action == 'deploy' }}
        run: node -p "const e = require('./packages/duel-server/domain-core/pins.json').emscripten; 'EMSDK_IMAGE=' + e.image + '@' + e.digest" >> "$GITHUB_ENV"

      # Look for the staging key first, then for the production key (read only). cache-matched-key is empty
      # when neither exists, and only then the bundle is built.
      - name: Restore pinned duel-engine bundle
        if: ${{ inputs.action == 'deploy' }}
        id: bundle
        uses: actions/cache/restore@v4
        with:
          path: data/duel-engine
          key: ${{ env.STAGING_BUNDLE_CACHE_KEY }}
          restore-keys: |
            ${{ env.BUNDLE_CACHE_KEY }}

      - name: Setup Node.js
        if: ${{ inputs.action == 'deploy' && steps.bundle.outputs.cache-matched-key == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install duel-engine build dependencies
        if: ${{ inputs.action == 'deploy' && steps.bundle.outputs.cache-matched-key == '' }}
        run: |
          npm ci --ignore-scripts
          npx patch-package --error-on-fail
          # duel:prepare merges release card databases with better-sqlite3.
          npm rebuild better-sqlite3

      - name: Build shared for card preparation
        if: ${{ inputs.action == 'deploy' && steps.bundle.outputs.cache-matched-key == '' }}
        run: npm run build --workspace=packages/shared

      - name: Prepare card data and scripts
        if: ${{ inputs.action == 'deploy' && steps.bundle.outputs.cache-matched-key == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run duel:prepare

      - name: Build pinned duel-engine cores
        if: ${{ inputs.action == 'deploy' && steps.bundle.outputs.cache-matched-key == '' }}
        run: |
          docker pull "$EMSDK_IMAGE"
          npx tsx packages/duel-server/scripts/build-domain-core.ts
          npx tsx packages/duel-server/scripts/build-domain-core.ts standard
          # The approved legacy Domain core. Domain defaults to legacy; Standard defaults to DUEL_STANDARD_1V1_ENGINE=pinned.
          npx tsx packages/duel-server/scripts/build-domain-core.ts legacy-domain

      - name: Save pinned duel-engine bundle
        if: ${{ inputs.action == 'deploy' && steps.bundle.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        with:
          path: data/duel-engine
          key: ${{ env.STAGING_BUNDLE_CACHE_KEY }}

      - name: Restore multi cores
        if: ${{ inputs.action == 'deploy' }}
        id: multi
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-build-info.json
            packages/duel-server/domain-core/dist/ocgcore.multi-domain-build-info.json
          key: ${{ env.MULTI_CACHE_KEY }}

      # Both cores use the full patch series. Domain also uses APPLY_DOMAIN=1 DOMAIN_MULTI=1.
      # Production Lua randomness: no LUA_FIXED_SEED (test.yml keeps that flag for differential tests).
      - name: Build multi cores
        if: ${{ inputs.action == 'deploy' && steps.multi.outputs.cache-hit != 'true' }}
        run: bash packages/duel-server/scripts/build-deploy-multi-cores.sh

      - name: Save multi cores
        if: ${{ inputs.action == 'deploy' && steps.multi.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-build-info.json
            packages/duel-server/domain-core/dist/ocgcore.multi-domain-build-info.json
          key: ${{ env.MULTI_CACHE_KEY }}

      - name: Verify duel-engine bundle
        if: ${{ inputs.action == 'deploy' }}
        run: |
          DUEL_DATA_DIR="$PWD/data/duel-engine" sh packages/duel-server/scripts/install-engine-bundle.sh
          sh packages/duel-server/scripts/check-legacy-pin.sh "$PWD/data/duel-engine"

      - name: Add both multi cores to the bundle
        if: ${{ inputs.action == 'deploy' }}
        run: |
          set -eu
          bundle="$RUNNER_TEMP/staging-bundle"
          mkdir -p "$bundle"
          cp -a data/duel-engine/. "$bundle/"
          node packages/duel-server/scripts/package-deploy-multi-cores.mjs "$bundle"
          DUEL_BUNDLE_SRC="$bundle" DUEL_DATA_DIR="$RUNNER_TEMP/staging-bundle-check/duel-engine" \
            sh packages/duel-server/scripts/install-engine-bundle.sh
          for core in ocgcore.multi ocgcore.multi-domain; do
            cmp "$RUNNER_TEMP/staging-bundle-check/duel-engine/$core.wasm" "$bundle/$core.wasm"
            cat "$bundle/$core.SOURCE" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf "$RUNNER_TEMP/staging-bundle-check"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key

      - name: Trust VM host key
        run: ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

      # remote-deploy.sh runs in /opt/yugioh-bot-staging. All values were checked in the first step.
      - name: Run on the VM
        run: |
          set -eu
          bundle_tar=
          remote_bundle=
          cleanup_transfer() {
            if [ -n "$bundle_tar" ]; then rm -f "$bundle_tar"; fi
            if [ -n "$remote_bundle" ]; then
              ssh -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "rm -f -- '$remote_bundle'" || true
            fi
          }
          trap cleanup_transfer EXIT
          if [ "$INPUT_ACTION" = deploy ]; then
            bundle_tar=$(mktemp "$RUNNER_TEMP/yugidraft-staging-bundle.XXXXXX.tar.gz")
            remote_bundle=$(ssh -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
              'mktemp /tmp/yugidraft-staging-bundle.XXXXXX.tar.gz')
            printf '%s' "$remote_bundle" | grep -Eq '^/tmp/yugidraft-staging-bundle\.[A-Za-z0-9]{6}\.tar\.gz$' || exit 1
            tar -C "$RUNNER_TEMP/staging-bundle" -czf "$bundle_tar" .
            scp -i ~/.ssh/vm_deploy_key -P "$VM_PORT" "$bundle_tar" "$VM_USER@$VM_HOST:$remote_bundle"
          fi
          ssh -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "env STAGING_ACTION='$INPUT_ACTION' STAGING_REF='$INPUT_REF' STAGING_COMMIT='$DEPLOY_COMMIT' STAGING_REFRESH_DB='$INPUT_REFRESH_DB' STAGING_HOST='$STAGING_HOST' STAGING_DOMAIN='$STAGING_DOMAIN' STAGING_HTTP_PORT='$STAGING_HTTP_PORT' STAGING_BUNDLE='$remote_bundle' STAGING_CLERK_ENV='$STAGING_CLERK_ENV' sh -s" \
            < scripts/staging/remote-deploy.sh

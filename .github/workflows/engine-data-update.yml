name: Engine data update

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      scripts:
        description: "Optional full CardScripts commit SHA"
        type: string
        required: false
      database:
        description: "Optional full BabelCDB commit SHA"
        type: string
        required: false
      strings:
        description: "Optional full Distribution commit SHA"
        type: string
        required: false
      dry_run:
        description: "Report and validate candidate data without publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: engine-data-update
  cancel-in-progress: false

jobs:
  prod-errors:
    # No checkout, dependencies, repository code or write token in this credential-bearing job.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Read fixed production script-error export
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
          ENGINE_DATA_PROD_SSH_PRIVATE_KEY: ${{ secrets.ENGINE_DATA_PROD_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/prod-script-errors.json"
          printf '%s\n' '{"available":false}' > "$snapshot"
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$ENGINE_DATA_PROD_SSH_PRIVATE_KEY" ] || [ -z "$VM_SSH_KNOWN_HOSTS" ]; then
            exit 0
          fi
          # Values are SSH arguments only, never interpolated into a remote command.
          [[ "$VM_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || exit 0
          [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || exit 0
          [[ "$VM_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$VM_PORT >= 1 && 10#$VM_PORT <= 65535)) || exit 0
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/prod-error-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$ENGINE_DATA_PROD_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          if timeout 40s ssh -F /dev/null -i "$ssh_dir/key" -p "$VM_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectionAttempts=1 -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" 'sh /opt/yugioh-bot/scripts/prod-script-errors.sh' 2>/dev/null \
            | head -c 65537 > "$ssh_dir/result"; then
            # Validate and re-emit a strict field allowlist BEFORE any public upload.
            python3 - "$ssh_dir/result" "$snapshot" <<'PYTHON'
          import json, re, sys
          try:
              raw = open(sys.argv[1], 'rb').read(65537)
              if len(raw) > 65536: raise ValueError()
              value = json.loads(raw)
              if not isinstance(value, dict) or value.get('available') is not True: raise ValueError()
              cards = value.get('cards')
              if not isinstance(cards, list) or len(cards) > 100: raise ValueError()
              kinds = {'all', 'legacy-normal', 'legacy-domain', 'pinned-normal', 'pinned-domain', 'multi-normal', 'multi-domain'}
              clean = []
              for card in cards:
                  if not isinstance(card, dict): raise ValueError()
                  code, name = card.get('code'), card.get('name')
                  duels, errors = card.get('distinctDuels'), card.get('errorCount')
                  blocked, digest, kind = card.get('autoBlocked'), card.get('scriptHash'), card.get('engineKind')
                  helpers = card.get('helperScripts')
                  integer = lambda n: type(n) is int and 0 <= n <= 9007199254740991
                  if not integer(code) or not 1 <= code <= 4294967295: raise ValueError()
                  if not isinstance(name, str) or len(name.encode('utf-16-le')) > 400: raise ValueError()
                  if not integer(duels) or not integer(errors) or duels > errors: raise ValueError()
                  if type(blocked) is not bool: raise ValueError()
                  if digest is not None and (not isinstance(digest, str) or not re.fullmatch('[a-f0-9]{64}', digest)): raise ValueError()
                  if kind is not None and (not isinstance(kind, str) or kind not in kinds): raise ValueError()
                  if helpers is not None and (not isinstance(helpers, list) or len(helpers) > 64 or any(not isinstance(name, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,128}\.lua', name) or re.fullmatch(r'c\d+\.lua', name) for name in helpers)): raise ValueError()
                  entry = dict(code=code, name=name, distinctDuels=duels, errorCount=errors, autoBlocked=blocked, scriptHash=digest)
                  if kind is not None: entry['engineKind'] = kind
                  if helpers is not None: entry['helperScripts'] = helpers
                  clean.append(entry)
              result = dict(available=True, cards=clean)
              if value.get('truncated') is True: result['truncated'] = True
              output = json.dumps(result, ensure_ascii=True, separators=(',', ':')) + '\n'
              if len(output.encode()) > 65536: raise ValueError()
              with open(sys.argv[2], 'w') as target: target.write(output)
          except Exception:
              # The initialized unavailable snapshot remains the only public output.
              pass
          PYTHON
          fi

      - name: Save optional production snapshot
        uses: actions/upload-artifact@v4
        with:
          name: prod-script-errors
          path: ${{ runner.temp }}/prod-script-errors.json
          retention-days: 1

  prepare:
    needs: prod-errors
    # An optional export or artifact failure must never prevent scheduled preparation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
    env:
      UPDATE_ARTIFACT_DIR: .status/engine-data-update
    steps:
      - name: Checkout the default branch without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set temporary paths
        id: paths
        run: |
          echo "DUEL_DATA_DIR=$RUNNER_TEMP/engine-data-bundle" >> "$GITHUB_ENV"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$UPDATE_ARTIFACT_DIR"

      - name: Download optional production snapshot
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prod-script-errors
          path: .status/engine-data-update

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install without a write token
        run: prlimit --core=1:1 -- npm ci

      # Build checked-out repository code before applying candidate data pins.
      - name: Build shared for engine-data scripts
        run: prlimit --core=1:1 -- npm run build --workspace=packages/shared

      # Even a workflow dry run applies candidates in this disposable, read-only-token job.
      - name: Resolve pins and write report
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_SHA: ${{ inputs.scripts }}
          DATABASE_SHA: ${{ inputs.database }}
          STRINGS_SHA: ${{ inputs.strings }}
        run: |
          args=(--defer-validation --report "$UPDATE_ARTIFACT_DIR/report.md" --metadata "$UPDATE_ARTIFACT_DIR/update.json")
          if [ -n "$SCRIPTS_SHA" ]; then args+=(--scripts "$SCRIPTS_SHA"); fi
          if [ -n "$DATABASE_SHA" ]; then args+=(--database "$DATABASE_SHA"); fi
          if [ -n "$STRINGS_SHA" ]; then args+=(--strings "$STRINGS_SHA"); fi
          prlimit --core=1:1 -- node --import tsx packages/duel-server/scripts/update-engine-data.ts "${args[@]}"

      # Preparation discovers cards.cdb + release-*.cdb at the new database pin.
      # No generated file list or additional writable publication path is needed.
      - name: Download and validate candidate engine bundle
        if: steps.update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: prlimit --core=1:1 -- npm run duel:prepare

      - name: Check multiplayer overlay and record result
        if: steps.update.outputs.changed == 'true'
        run: |
          result=0
          prlimit --core=1:1 -- node --import tsx packages/duel-server/scripts/generate-multi-scripts.ts --check > "$UPDATE_ARTIFACT_DIR/overlay-check.log" 2>&1 || result=$?
          cat "$UPDATE_ARTIFACT_DIR/overlay-check.log"
          printf '%s\n' "$result" > "$UPDATE_ARTIFACT_DIR/overlay-exit.txt"

      - name: Probe the prepared candidate and finalize report
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: prlimit --core=1:1 -- node --import tsx packages/duel-server/scripts/validate-engine-data.ts

      - name: Export only the reported pin patch
        if: steps.update.outputs.changed == 'true'
        run: |
          mapfile -t files < <(jq -r '.files[]' "$UPDATE_ARTIFACT_DIR/update.json")
          test "${#files[@]}" -gt 0
          git diff --binary -- "${files[@]}" > "$UPDATE_ARTIFACT_DIR/update.patch"

      - name: Publish available report if validation failed
        if: failure()
        run: |
          if [ -f "$UPDATE_ARTIFACT_DIR/pr-body.md" ]; then
            printf '\n\nExport failed. See the workflow logs and report artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$UPDATE_ARTIFACT_DIR/report.md" ]; then
            prlimit --core=0:0 -- node --import tsx --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises';
          import { boundedReport } from './packages/duel-server/scripts/engine-data-report.ts';
          const url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const report = await readFile(`${process.env.UPDATE_ARTIFACT_DIR}/report.md`, 'utf8');
          await appendFile(process.env.GITHUB_STEP_SUMMARY, boundedReport(report, url, 990000) + `\n\nValidation failed. Full report: [artifact](${url}#artifacts).\n`);
          JS
          fi

      - name: Save patch and complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-data-update-report
          path: .status/engine-data-update/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove downloaded candidate data
        if: always()
        run: rm -rf -- "$DUEL_DATA_DIR"

  publish:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      UPDATE_ARTIFACT_DIR: .status/engine-data-update
      GH_REPO: ${{ github.repository }}
      UPDATE_BRANCH: chore/engine-data-update
      BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
    steps:
      - name: Checkout prepared base without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js without installing dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download prepared patch and report
        uses: actions/download-artifact@v4
        with:
          name: engine-data-update-report
          path: .status/engine-data-update

      - name: Preserve reviewed edits or publish the candidate
        env:
          GH_TOKEN: ${{ secrets.ENGINE_DATA_PR_TOKEN || github.token }}
          HAS_PR_TOKEN: ${{ secrets.ENGINE_DATA_PR_TOKEN != '' }}
        run: |
          gh auth setup-git
          prlimit --core=1:1 -- node scripts/ci/publish-engine-data.mjs

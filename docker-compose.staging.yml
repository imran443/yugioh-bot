# Staging stack: lets people test 3-player duels on the same VM as production, with no shared state.
# Runbook: docs/deployment/staging.md
#
# Run it only through scripts/staging/compose.sh. The script names the project and the env file, so a
# command can never reach the production stack:
#   docker compose --env-file .env.staging -p yugidraft-staging -f docker-compose.staging.yml <command>
#
# What is different from docker-compose.yml:
#   - Services are ws, duel, web, worker and caddy only. Discord I/O is disabled.
#   - Its own project name, its own Docker network, its own data directory and its own Caddy.
#   - Memory, CPU and log limits on every service, so staging cannot starve production (4 GB VM).
#   - The same Dockerfile targets (ws, duel, web, worker). No dev override file.
name: yugidraft-staging

x-staging-service: &staging-service
  # "no": staging never starts by itself after a crash or VM reboot.
  # Run the staging workflow to start it again after checking available memory.
  restart: "no"
  # Under CPU pressure staging gets a quarter of the weight of a default container (1024).
  cpu_shares: 256
  networks:
    - staging
  security_opt:
    - no-new-privileges:true
  # If the VM runs out of memory, the kernel stops a staging process before a production one.
  oom_score_adj: 500
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ws:
    <<: *staging-service
    build:
      context: .
      target: ws
    user: "${STAGING_UID:-1000}:${STAGING_GID:-1000}"
    environment:
      - NODE_OPTIONS=--max-old-space-size=${STAGING_WS_HEAP_MB:-128}
      - WEB_URL=${WEB_URL:?WEB_URL is required}
      - WS_PORT=3001
      - WS_INTERNAL_PORT=4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:?WS_INTERNAL_SECRET is missing, run scripts/staging/make-staging-env.sh}
      - DATABASE_PATH=/app/data/bot.sqlite
    command: node packages/ws/dist/server.js
    volumes:
      - ${STAGING_DATA_DIR:-./data-staging}:/app/data
    mem_limit: ${STAGING_MEM_WS:-192m}
    memswap_limit: ${STAGING_MEM_WS:-192m}
    cpus: 0.5
    healthcheck:
      # Socket.IO answers a polling handshake on its public port.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/socket.io/?EIO=4&transport=polling').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  duel:
    <<: *staging-service
    build:
      context: .
      target: duel-bundled
      additional_contexts:
        engine: ./.deploy-duel-engine
    user: "${STAGING_UID:-1000}:${STAGING_GID:-1000}"
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      # Both multi cores and the Lua overlay are installed here from the CI bundle.
      - DUEL_DATA_DIR=/app/data/duel-engine
      - DUEL_INTERNAL_HOST=0.0.0.0
      - DUEL_INTERNAL_PORT=4003
      - DUEL_INTERNAL_SECRET=${DUEL_INTERNAL_SECRET:?DUEL_INTERNAL_SECRET is missing, run scripts/staging/make-staging-env.sh}
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:?WS_INTERNAL_SECRET is missing, run scripts/staging/make-staging-env.sh}
      - DUEL_ARCHIVE_AFTER_MS=${DUEL_ARCHIVE_AFTER_MS:-600000}
      # Free an idle engine worker sooner than production does: memory is tight.
      - DUEL_IDLE_WORKER_MS=${STAGING_DUEL_IDLE_WORKER_MS:-120000}
      # Test tools for the testers: the Report button, the stall watchdog reports, the scenario presets and the
      # debug-trace route. The web needs the same flag (see the web service). The report folder is on the data
      # volume, because the container user cannot write in /app.
      - DUEL_SCENARIOS=1
      - DUEL_REPORT_DIR=/app/data/duel-reports
      # Tag, 3-player and 4-player tables are on in staging. Production has them on by default too. The web needs the same value.
      - MULTIPLAYER_TABLES=${STAGING_MULTIPLAYER_TABLES:-1}
      # Staging tests the 1v1 engine that production uses. Set STAGING_DUEL_1V1_ENGINE=pinned to test the merged engine.
      - DUEL_1V1_ENGINE=${STAGING_DUEL_1V1_ENGINE:-legacy}
      # Card script runtime failures report and continue; strict is an operational override.
      - DUEL_SCRIPT_ERRORS=${STAGING_DUEL_SCRIPT_ERRORS:-tolerant}
    volumes:
      - ${STAGING_DATA_DIR:-./data-staging}:/app/data
    mem_limit: ${STAGING_MEM_DUEL:-768m}
    memswap_limit: ${STAGING_MEM_DUEL:-768m}
    cpus: 1.0
    healthcheck:
      # The private port only has to accept a TCP connection.
      test: ["CMD", "node", "-e", "require('net').connect(4003,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    <<: *staging-service
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Staging Clerk publishable key is required}
    user: "${STAGING_UID:-1000}:${STAGING_GID:-1000}"
    environment:
      - NODE_OPTIONS=--max-old-space-size=${STAGING_WEB_HEAP_MB:-384}
      - DATABASE_PATH=/app/data/bot.sqlite
      - CARD_IMAGE_CACHE_DIR=/app/data/card-images
      - DISCORD_BOT_ENABLED=0
      - WEB_URL=${WEB_URL:?WEB_URL is required}
      - MARKETING_URL=${MARKETING_URL:-}
      - OWNER_USER_IDS=${OWNER_USER_IDS:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_DEFAULT_CHANNEL_ID=${DISCORD_DEFAULT_CHANNEL_ID:-}
      - DISCORD_REMINDER_CHANNEL_ID=${DISCORD_REMINDER_CHANNEL_ID:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:?Staging Clerk secret is required at runtime}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
      - DUEL_FX_LAB=${DUEL_FX_LAB:-0}
      - DRAFT_TEST_BOTS=${DRAFT_TEST_BOTS:-0}
      - THEME_DRAFTS=${STAGING_THEME_DRAFTS:-1}
      - BUG_REPORT_GITHUB_TOKEN=${BUG_REPORT_GITHUB_TOKEN:-}
      - BUG_REPORT_GITHUB_REPO=${BUG_REPORT_GITHUB_REPO:-DuelingDomain/yugioh-bot}
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:?WS_INTERNAL_SECRET is missing, run scripts/staging/make-staging-env.sh}
      - DUEL_INTERNAL_URL=http://duel:4003
      # Shows the Report button and opens the scenario routes. Same flag as on the duel service.
      - DUEL_SCENARIOS=1
      - MULTIPLAYER_TABLES=${STAGING_MULTIPLAYER_TABLES:-1}
      - DUEL_INTERNAL_SECRET=${DUEL_INTERNAL_SECRET:?DUEL_INTERNAL_SECRET is missing, run scripts/staging/make-staging-env.sh}
    volumes:
      - ${STAGING_DATA_DIR:-./data-staging}:/app/data
    mem_limit: ${STAGING_MEM_WEB:-512m}
    memswap_limit: ${STAGING_MEM_WEB:-512m}
    cpus: 1.0
    depends_on:
      - ws
      - duel

  worker:
    build:
      context: .
      target: worker
    <<: *staging-service
    user: "${STAGING_UID:-1000}:${STAGING_GID:-1000}"
    stop_grace_period: 150s
    mem_limit: ${STAGING_MEM_WORKER:-192m}
    memswap_limit: ${STAGING_MEM_WORKER:-192m}
    cpus: 0.5
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
      - DATABASE_PATH=/app/data/bot.sqlite
      - CARD_IMAGE_CACHE_DIR=/app/data/card-images
      - CARD_IMAGE_CACHE_MAX_BYTES=${CARD_IMAGE_CACHE_MAX_BYTES:-16106127360}
      - WORKER_HEALTH_PATH=/tmp/yugidraft-worker-health.json
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_BOT_ENABLED=0
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
      - SETS_SYNC_CRON=${SETS_SYNC_CRON:-0 6 * * *}
      - SETS_SYNC_TIMEZONE=${SETS_SYNC_TIMEZONE:-UTC}
      - IMAGE_CLEANUP_CRON=${IMAGE_CLEANUP_CRON:-0 4 * * *}
      - IMAGE_CLEANUP_TIMEZONE=${IMAGE_CLEANUP_TIMEZONE:-UTC}
    volumes:
      - ${STAGING_DATA_DIR:-./data-staging}:/app/data
    depends_on:
      - ws

  caddy:
    <<: *staging-service
    image: caddy:2-alpine
    ports:
      # Plain HTTP only: http://<VM address>:8080. Never publish host port 80 or 443: the production Caddy
      # owns them (scripts/staging/compose.sh refuses a port below 1024).
      - "${STAGING_BIND:-0.0.0.0}:${STAGING_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: ${STAGING_MEM_CADDY:-64m}
    memswap_limit: ${STAGING_MEM_CADDY:-64m}
    cpus: 0.25
    depends_on:
      - web
      - ws

# A network of its own. The names web, ws, duel and worker mean the staging services only here.
networks:
  staging:
    name: yugidraft-staging-net

volumes:
  caddy_data:
  caddy_config:
